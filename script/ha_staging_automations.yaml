- id: peblar_solar_test_controller_dev
  alias: Peblar solar test controller (DEV)
  description: >-
    Disarmed by default. Uses live Growatt meter flow and battery SoC to
    control the physical DEV Peblar in direct mode. Missing or stale inputs
    stop and disarm the test.
  mode: single
  max_exceeded: silent
  variables:
    max_battery_discharge_w: 3500
    battery_discharge_ramp_margin_w: 300
  triggers:
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: state
      entity_id: input_boolean.peblar_solar_test_armed
      to: "on"
      id: arm
    - trigger: state
      entity_id: input_boolean.peblar_solar_test_armed
      to: "off"
      id: disarm
    - trigger: time_pattern
      minutes: "/1"
      id: control
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: startup
          sequence:
            - delay: "00:00:30"
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.peblar_solar_test_armed
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.peblar_solar_session_active
            - if:
                - condition: state
                  entity_id: select.peblar_ev_charger_smart_charging
                  state: default
                - condition: state
                  entity_id: switch.peblar_ev_charger_charge
                  state: "on"
              then:
                - action: switch.turn_off
                  target:
                    entity_id: switch.peblar_ev_charger_charge
        - conditions:
            - condition: trigger
              id: disarm
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.peblar_ev_charger_charge
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.peblar_solar_session_active
            - action: logbook.log
              data:
                name: Peblar solar test
                message: Test stopped; charging is off in direct mode.
        - conditions:
            - condition: state
              entity_id: input_boolean.peblar_solar_test_armed
              state: "off"
            - condition: state
              entity_id: switch.peblar_ev_charger_charge
              state: "on"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.peblar_ev_charger_charge
        - conditions:
            - condition: state
              entity_id: input_boolean.peblar_solar_test_armed
              state: "on"
          sequence:
            - action: homeassistant.update_entity
              target:
                entity_id:
                  - sensor.zolder_growatt_last_successful_update
                  - sensor.growatt_soc
                  - sensor.growatt_power_to_user
                  - sensor.growatt_power_to_grid
                  - sensor.growatt_charge_power
                  - sensor.growatt_discharge_power
                  - switch.growatt_ac_charge
                  - sensor.peblar_ev_charger_state
                  - sensor.peblar_ev_charger_power
                  - switch.peblar_ev_charger_charge
                  - number.peblar_ev_charger_charge_limit
                  - select.peblar_ev_charger_smart_charging
            - delay: "00:00:02"
            - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {% set t = as_timestamp(states('sensor.zolder_growatt_last_successful_update'), 0) %}
                        {% set n = as_timestamp(now()) %}
                        {{ t == 0 or n - t < 0 or n - t > 15
                          or not is_number(states('sensor.growatt_soc'))
                          or not is_number(states('sensor.growatt_power_to_user'))
                          or not is_number(states('sensor.growatt_power_to_grid'))
                          or not is_number(states('sensor.growatt_charge_power'))
                          or not is_number(states('sensor.growatt_discharge_power'))
                          or not is_number(states('number.peblar_ev_charger_charge_limit'))
                          or states('sensor.peblar_ev_charger_state') in ['unknown', 'unavailable', 'none']
                          or states('select.peblar_ev_charger_smart_charging') in ['unknown', 'unavailable', 'none'] }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_session_active
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_test_armed
                    - action: persistent_notification.create
                      data:
                        notification_id: peblar_solar_test_stopped
                        title: Peblar solar test stopped
                        message: >-
                          A Growatt or Peblar input is missing or stale. Charging
                          was stopped and the test was disarmed.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ states('sensor.growatt_soc') | float(-1) < 0
                          or states('sensor.growatt_soc') | float(-1) > 100
                          or states('sensor.peblar_ev_charger_state') not in ['suspended', 'charging']
                          or not is_state('switch.growatt_ac_charge', 'off')
                          or now().weekday() not in [4, 5, 6] }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_session_active
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_test_armed
                    - action: persistent_notification.create
                      data:
                        notification_id: peblar_solar_test_precondition
                        title: Peblar solar test stopped
                        message: >-
                          The EV, battery SoC, or Growatt AC-charge precondition
                          is not safe, or this solar trial is outside Friday through
                          Sunday. Charging was stopped and the test was disarmed.
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "off"
                    - condition: state
                      entity_id: input_boolean.peblar_solar_session_active
                      state: "off"
                  sequence:
                    - if:
                        - condition: template
                          value_template: >-
                            {{ states('number.peblar_ev_charger_charge_limit') | float(0) != 6 }}
                      then:
                        - action: number.set_value
                          target:
                            entity_id: number.peblar_ev_charger_charge_limit
                          data:
                            value: 6
                    - if:
                        - condition: template
                          value_template: >-
                            {{ not is_state('select.peblar_ev_charger_smart_charging', 'default') }}
                      then:
                        - action: select.select_option
                          target:
                            entity_id: select.peblar_ev_charger_smart_charging
                          data:
                            option: default
                    - if:
                        - condition: template
                          value_template: "{{ states('sensor.growatt_soc') | float(0) > 90 }}"
                      then:
                        - action: switch.turn_on
                          target:
                            entity_id: switch.peblar_ev_charger_charge
                        - action: input_boolean.turn_on
                          target:
                            entity_id: input_boolean.peblar_solar_session_active
                        - action: persistent_notification.dismiss
                          data:
                            notification_id: peblar_solar_test_stopped
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: state
                      entity_id: input_boolean.peblar_solar_session_active
                      state: "off"
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: 6
                    - action: select.select_option
                      target:
                        entity_id: select.peblar_ev_charger_smart_charging
                      data:
                        option: default
                    - if:
                        - condition: template
                          value_template: "{{ states('sensor.growatt_soc') | float(0) > 90 }}"
                      then:
                        - action: switch.turn_on
                          target:
                            entity_id: switch.peblar_ev_charger_charge
                        - action: input_boolean.turn_on
                          target:
                            entity_id: input_boolean.peblar_solar_session_active
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ not is_state('select.peblar_ev_charger_smart_charging', 'default') }}
                  sequence:
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_session_active
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: 6
                    - action: select.select_option
                      target:
                        entity_id: select.peblar_ev_charger_smart_charging
                      data:
                        option: default
                    - if:
                        - condition: template
                          value_template: "{{ states('sensor.growatt_soc') | float(0) > 90 }}"
                      then:
                        - action: switch.turn_on
                          target:
                            entity_id: switch.peblar_ev_charger_charge
                        - action: input_boolean.turn_on
                          target:
                            entity_id: input_boolean.peblar_solar_session_active
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ states('sensor.growatt_soc') | float(0) < 80
                          and states('number.peblar_ev_charger_charge_limit') | float(6) > 6 }}
                  sequence:
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: 6
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: template
                      value_template: >-
                        {% set soc = states('sensor.growatt_soc') | float(0) %}
                        {% set limit = states('number.peblar_ev_charger_charge_limit') | float(6) %}
                        {{ soc < 80 and limit <= 6 }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_session_active
                    - action: logbook.log
                      data:
                        name: Peblar solar test
                        message: Battery fell below 80% at the 6 A minimum; charging paused.
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: template
                      value_template: >-
                        {% set limit = states('number.peblar_ev_charger_charge_limit') | float(6) %}
                        {% set import_w = states('sensor.growatt_power_to_user') | float(0) %}
                        {% set soc = states('sensor.growatt_soc') | float(0) %}
                        {% set discharge_w = states('sensor.growatt_discharge_power') | float(0) %}
                        {{ limit > 6 and (import_w > 400
                          or discharge_w > max_battery_discharge_w
                          or (soc <= 85 and discharge_w > 200)) }}
                  sequence:
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: "{{ [6, (states('number.peblar_ev_charger_charge_limit') | int(6)) - 1] | max }}"
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: template
                      value_template: >-
                        {% set soc = states('sensor.growatt_soc') | float(0) %}
                        {% set export_w = states('sensor.growatt_power_to_grid') | float(0) %}
                        {% set import_w = states('sensor.growatt_power_to_user') | float(0) %}
                        {% set charge_w = states('sensor.growatt_charge_power') | float(0) %}
                        {% set discharge_w = states('sensor.growatt_discharge_power') | float(0) %}
                        {% set limit = states('number.peblar_ev_charger_charge_limit') | float(6) %}
                        {% set max_limit = state_attr('number.peblar_ev_charger_charge_limit', 'max') | float(0) %}
                        {{ limit < max_limit
                          and discharge_w + battery_discharge_ramp_margin_w < max_battery_discharge_w and (
                          (soc > 85 and import_w < 100)
                          or (soc >= 85 and (export_w > 800 or charge_w > 800))
                        ) }}
                  sequence:
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: "{{ (states('number.peblar_ev_charger_charge_limit') | int(6)) + 1 }}"
      default: []

- id: peblar_restore_scheduled_charging_dev
  alias: Restore Peblar night schedule (DEV)
  description: Restore the recorded 02:00–06:00 DEV schedule and 28 A limit after the solar trial.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_button.peblar_restore_night_schedule
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.peblar_ev_charger_charge
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.peblar_solar_test_armed
          - input_boolean.peblar_solar_session_active
    - action: number.set_value
      target:
        entity_id: number.peblar_ev_charger_charge_limit
      data:
        value: 28
    - action: select.select_option
      target:
        entity_id: select.peblar_ev_charger_smart_charging
      data:
        option: scheduled
    - action: logbook.log
      data:
        name: Peblar solar test
        message: Restored scheduled mode and 28 A charging limit.
