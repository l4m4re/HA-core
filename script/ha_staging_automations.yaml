- id: peblar_solar_relay_switch_history_dev
  alias: Peblar solar relay switch history (DEV)
  description: Keep a persistent rolling history of actual Peblar charge relay state changes.
  mode: queued
  max: 5
  variables:
    relay_window_s: 900
  triggers:
    - trigger: state
      entity_id: switch.peblar_ev_charger_charge
      to: "on"
    - trigger: state
      entity_id: switch.peblar_ev_charger_charge
      to: "off"
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
          and trigger.to_state is not none
          and trigger.from_state.state in ['on', 'off']
          and trigger.to_state.state in ['on', 'off']
          and trigger.from_state.state != trigger.to_state.state }}
  actions:
    - action: input_text.set_value
      target:
        entity_id: input_text.peblar_solar_relay_switch_history
      data:
        value: >-
          {% set cutoff = as_timestamp(now()) | int(0) - relay_window_s %}
          {% set history = states('input_text.peblar_solar_relay_switch_history') %}
          {% set kept = namespace(values=[]) %}
          {% for raw_timestamp in history.split(',') %}
            {% set timestamp = raw_timestamp | trim | int(0) %}
            {% if timestamp >= cutoff %}
              {% set kept.values = kept.values + [timestamp] %}
            {% endif %}
          {% endfor %}
          {% set kept.values = kept.values + [as_timestamp(now()) | int(0)] %}
          {{ kept.values | join(',') }}

- id: peblar_solar_test_anchor_target_dev
  alias: Peblar solar test anchor target (DEV)
  description: Anchor the solar test battery target to the current Growatt SOC when armed.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: input_boolean.peblar_solar_test_armed
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.peblar_solar_test_armed
      state: "on"
    - condition: template
      value_template: >-
        {{ is_number(states('sensor.growatt_battery_battery_soc'))
          and 0 <= states('sensor.growatt_battery_battery_soc') | float(-1) <= 100 }}
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.peblar_solar_battery_target_soc
      data:
        value: >-
          {% set soc = states('sensor.growatt_battery_battery_soc') | float(0) %}
          {{ [95, [5, soc] | max] | min | round(0) }}
    - action: logbook.log
      data:
        name: Peblar solar test
        message: >-
          Solar control anchored its target to the current Growatt SOC when the
          test was armed.

- id: peblar_solar_test_controller_dev
  alias: Peblar solar test controller (DEV)
  description: >-
    The slow loop starts on sustained grid export and stops on the SOC target;
    the minute loop trims Peblar current against a SOC-dependent battery power
    target while removing positive grid export.
    Arming anchors the target to the current SoC once. Stale inputs stop
    charging without disarming the test; transient unavailable values within
    the freshness window are tolerated.
  mode: single
  max_exceeded: silent
  variables:
    min_peblar_charge_a: 6
    battery_balance_gain: 0.5
    soc_target_battery_power_w: 500
    soc_target_band_pct: 1
    grid_power_threshold_w: 100
    growatt_max_age_s: 120
    relay_min_state_s: 600
    relay_window_s: 900
    relay_max_switches: 2
  triggers:
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: state
      entity_id: input_boolean.peblar_solar_test_armed
      to: "on"
      id: arm
    - trigger: state
      entity_id: sensor.peblar_ev_charger_state
      to: suspended
      id: ev_connected
    - trigger: state
      entity_id: sensor.peblar_ev_charger_state
      to: charging
      id: ev_charging
    - trigger: state
      entity_id: input_boolean.peblar_solar_test_armed
      to: "off"
      id: disarm
    - trigger: time_pattern
      minutes: "/1"
      id: control
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: startup
          sequence:
            - delay: "00:01:00"
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.peblar_solar_session_active
            - if:
                - condition: state
                  entity_id: select.peblar_ev_charger_smart_charging
                  state: default
                - condition: state
                  entity_id: switch.peblar_ev_charger_charge
                  state: "on"
              then:
                - action: switch.turn_off
                  target:
                    entity_id: switch.peblar_ev_charger_charge
        - conditions:
            - condition: trigger
              id: disarm
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.peblar_ev_charger_charge
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.peblar_solar_session_active
            - action: logbook.log
              data:
                name: Peblar solar test
                message: Test stopped; charging is off in direct mode.
        - conditions:
            - condition: state
              entity_id: input_boolean.peblar_solar_test_armed
              state: "off"
            - condition: state
              entity_id: switch.peblar_ev_charger_charge
              state: "on"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.peblar_ev_charger_charge
        - conditions:
            - condition: state
              entity_id: input_boolean.peblar_solar_test_armed
              state: "on"
          sequence:
            - action: homeassistant.update_entity
              target:
                entity_id:
                  - sensor.peblar_ev_charger_state
                  - sensor.peblar_ev_charger_power
                  - switch.peblar_ev_charger_charge
                  - number.peblar_ev_charger_charge_limit
                  - select.peblar_ev_charger_smart_charging
                  - sensor.growatt_grid_grid_export_power
                  - sensor.growatt_battery_battery_soc
                  - sensor.growatt_battery_battery_charge_power
                  - sensor.growatt_battery_battery_discharge_power
            - delay: "00:00:02"
            - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {% set t = as_timestamp(states('sensor.growatt_last_update'), 0) %}
                        {% set n = as_timestamp(now()) %}
                        {{ t == 0 or n - t < 0 or n - t > growatt_max_age_s
                          or not is_number(states('number.peblar_ev_charger_charge_limit'))
                          or states('sensor.peblar_ev_charger_state') in ['unknown', 'unavailable', 'none']
                          or states('select.peblar_ev_charger_smart_charging') in ['unknown', 'unavailable', 'none']
                          or not is_number(states('sensor.growatt_grid_grid_export_power'))
                          or not is_number(states('sensor.growatt_battery_battery_soc'))
                          or not is_number(states('sensor.growatt_battery_battery_charge_power'))
                          or not is_number(states('sensor.growatt_battery_battery_discharge_power')) }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_session_active
                    - action: persistent_notification.create
                      data:
                        notification_id: peblar_solar_test_stopped
                        title: Peblar solar test stopped
                        message: >-
                          A Growatt or Peblar input is missing or stale. Charging
                          was stopped; the test remains armed.
                - conditions:
                    - condition: state
                      entity_id: sensor.peblar_ev_charger_state
                      state: no_ev_connected
                  sequence:
                    - if:
                        - condition: template
                          value_template: >-
                            {{ is_state('switch.peblar_ev_charger_charge', 'on')
                              or is_state('input_boolean.peblar_solar_session_active', 'on') }}
                      then:
                        - action: switch.turn_off
                          target:
                            entity_id: switch.peblar_ev_charger_charge
                        - action: input_boolean.turn_off
                          target:
                            entity_id: input_boolean.peblar_solar_session_active
                        - action: logbook.log
                          data:
                            name: Peblar solar test
                            message: Paused while the EV is disconnected; the test remains armed.
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: template
                      value_template: >-
                        {% set soc = states('sensor.growatt_battery_battery_soc') | float(-1) %}
                        {% set target = states('input_number.peblar_solar_battery_target_soc') | float(90) %}
                        {% set on_for_s = as_timestamp(now()) - as_timestamp(states.switch.peblar_ev_charger_charge.last_changed, 0) %}
                        {% set cutoff = as_timestamp(now()) | int(0) - relay_window_s %}
                        {% set recent_switches = namespace(count=0) %}
                        {% for raw_timestamp in states('input_text.peblar_solar_relay_switch_history').split(',') %}
                          {% if raw_timestamp | trim | int(0) >= cutoff %}
                            {% set recent_switches.count = recent_switches.count + 1 %}
                          {% endif %}
                        {% endfor %}
                        {{ on_for_s >= 300
                          and on_for_s >= relay_min_state_s
                          and recent_switches.count < relay_max_switches
                          and soc <= target - soc_target_band_pct }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_session_active
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: 6
                    - action: logbook.log
                      data:
                        name: Peblar solar test
                        message: >-
                          Charging paused because the Growatt SOC fell more than
                          1 percentage point below the solar target.
                - conditions:
                    - condition: template
                      value_template: >-
                        {% set soc = states('sensor.growatt_battery_battery_soc') %}
                        {{ (is_number(soc) and (soc | float < 0 or soc | float > 100))
                          or states('sensor.peblar_ev_charger_state') not in ['suspended', 'charging']
                          }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_session_active
                    - action: persistent_notification.create
                      data:
                        notification_id: peblar_solar_test_precondition
                        title: Peblar solar test stopped
                        message: >-
                          The EV or battery SoC precondition is not safe.
                          Charging was stopped; the test remains armed.
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "off"
                    - condition: state
                      entity_id: input_boolean.peblar_solar_session_active
                      state: "off"
                  sequence:
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: 6
                    - if:
                        - condition: template
                          value_template: >-
                            {{ not is_state('select.peblar_ev_charger_smart_charging', 'default') }}
                      then:
                        - action: select.select_option
                          target:
                            entity_id: select.peblar_ev_charger_smart_charging
                          data:
                            option: default
                        - action: homeassistant.update_entity
                          target:
                            entity_id: switch.peblar_ev_charger_charge
                        - if:
                            - condition: state
                              entity_id: switch.peblar_ev_charger_charge
                              state: "on"
                          then:
                            - action: switch.turn_off
                              target:
                                entity_id: switch.peblar_ev_charger_charge
                    - if:
                        - condition: template
                          value_template: >-
                            {% set soc = states('sensor.growatt_battery_battery_soc') | float(-1) %}
                            {% set target = states('input_number.peblar_solar_battery_target_soc') | float(90) %}
                            {% set export_w = states('sensor.growatt_grid_grid_export_power') | float(-1) %}
                            {% set off_for_s = as_timestamp(now()) - as_timestamp(states.switch.peblar_ev_charger_charge.last_changed, 0) %}
                            {% set cutoff = as_timestamp(now()) | int(0) - relay_window_s %}
                            {% set recent_switches = namespace(count=0) %}
                            {% for raw_timestamp in states('input_text.peblar_solar_relay_switch_history').split(',') %}
                              {% if raw_timestamp | trim | int(0) >= cutoff %}
                                {% set recent_switches.count = recent_switches.count + 1 %}
                              {% endif %}
                            {% endfor %}
                            {{ off_for_s >= relay_min_state_s
                              and recent_switches.count < relay_max_switches
                              and ((soc >= target + soc_target_band_pct)
                                or (soc == target and export_w > grid_power_threshold_w)) }}
                      then:
                        - action: switch.turn_on
                          target:
                            entity_id: switch.peblar_ev_charger_charge
                        - action: input_boolean.turn_on
                          target:
                            entity_id: input_boolean.peblar_solar_session_active
                        - action: logbook.log
                          data:
                            name: Peblar solar test
                            message: >-
                              Charging started at the SOC target with sustained
                              grid export.
                        - action: persistent_notification.dismiss
                          data:
                            notification_id: peblar_solar_test_stopped
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: state
                      entity_id: input_boolean.peblar_solar_session_active
                      state: "off"
                    - condition: template
                      value_template: >-
                        {{ is_number(states('sensor.growatt_battery_battery_soc')) }}
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: 6
                    - action: select.select_option
                      target:
                        entity_id: select.peblar_ev_charger_smart_charging
                      data:
                        option: default
                    - action: homeassistant.update_entity
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - if:
                        - condition: state
                          entity_id: switch.peblar_ev_charger_charge
                          state: "on"
                      then:
                        - action: switch.turn_off
                          target:
                            entity_id: switch.peblar_ev_charger_charge
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: state
                      entity_id: input_boolean.peblar_solar_session_active
                      state: "on"
                    - condition: template
                      value_template: >-
                        {{ not is_state('select.peblar_ev_charger_smart_charging', 'default') }}
                  sequence:
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.peblar_solar_session_active
                    - action: switch.turn_off
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: 6
                    - action: select.select_option
                      target:
                        entity_id: select.peblar_ev_charger_smart_charging
                      data:
                        option: default
                    - action: homeassistant.update_entity
                      target:
                        entity_id: switch.peblar_ev_charger_charge
                    - if:
                        - condition: state
                          entity_id: switch.peblar_ev_charger_charge
                          state: "on"
                      then:
                        - action: switch.turn_off
                          target:
                            entity_id: switch.peblar_ev_charger_charge
                - conditions:
                    - condition: state
                      entity_id: switch.peblar_ev_charger_charge
                      state: "on"
                    - condition: template
                      value_template: >-
                        {% set charge_state = states('sensor.growatt_battery_battery_charge_power') %}
                        {% set discharge_state = states('sensor.growatt_battery_battery_discharge_power') %}
                        {% set peblar_state = states('sensor.peblar_ev_charger_power') %}
                        {% set charge_w = charge_state | float(0) %}
                        {% set discharge_w = discharge_state | float(0) %}
                        {% set peblar_w = peblar_state | float(0) %}
                        {% set grid_export_state = states('sensor.growatt_grid_grid_export_power') %}
                        {% set grid_export_w = grid_export_state | float(0) %}
                        {% set limit = states('number.peblar_ev_charger_charge_limit') | float(6) %}
                        {% set max_limit = state_attr('number.peblar_ev_charger_charge_limit', 'max') | float(0) %}
                        {% set soc = states('sensor.growatt_battery_battery_soc') | float(0) %}
                        {% set target = states('input_number.peblar_solar_battery_target_soc') | float(90) %}
                        {% set soc_error = target - soc %}
                        {% set net_battery_w = charge_w - discharge_w %}
                        {% set desired_battery_w = 0 %}
                        {% if soc_error > soc_target_band_pct %}
                          {% set desired_battery_w = soc_target_battery_power_w %}
                        {% elif soc_error < -soc_target_band_pct %}
                          {% set desired_battery_w = -soc_target_battery_power_w %}
                        {% endif %}
                        {% set control_error = net_battery_w - desired_battery_w + [grid_export_w, 0] | max %}
                        {{ trigger.id == 'control'
                          and is_number(soc)
                          and is_number(charge_state)
                          and is_number(discharge_state)
                          and is_number(peblar_state)
                          and is_number(grid_export_state)
                          and peblar_w > 0
                          and limit >= min_peblar_charge_a
                          and max_limit >= min_peblar_charge_a
                          and control_error | abs > 20 }}
                  sequence:
                    - action: number.set_value
                      target:
                        entity_id: number.peblar_ev_charger_charge_limit
                      data:
                        value: >-
                          {% set charge_w = states('sensor.growatt_battery_battery_charge_power') | float(0) %}
                          {% set discharge_w = states('sensor.growatt_battery_battery_discharge_power') | float(0) %}
                          {% set peblar_w = states('sensor.peblar_ev_charger_power') | float(0) %}
                          {% set grid_export_w = states('sensor.growatt_grid_grid_export_power') | float(0) %}
                          {% set limit = states('number.peblar_ev_charger_charge_limit') | float(6) %}
                          {% set max_limit = state_attr('number.peblar_ev_charger_charge_limit', 'max') | float(0) %}
                          {% set net_battery_w = charge_w - discharge_w %}
                          {% set soc = states('sensor.growatt_battery_battery_soc') | float(0) %}
                          {% set target = states('input_number.peblar_solar_battery_target_soc') | float(90) %}
                          {% set soc_error = target - soc %}
                          {% set desired_battery_w = 0 %}
                          {% if soc_error > soc_target_band_pct %}
                            {% set desired_battery_w = soc_target_battery_power_w %}
                          {% elif soc_error < -soc_target_band_pct %}
                            {% set desired_battery_w = -soc_target_battery_power_w %}
                          {% endif %}
                          {% set control_error = net_battery_w - desired_battery_w + [grid_export_w, 0] | max %}
                          {% set watts_per_amp = peblar_w / limit %}
                          {% set target_limit = limit + battery_balance_gain * control_error / watts_per_amp %}
                          {{ [max_limit, [min_peblar_charge_a, target_limit] | max] | min | round(2) }}
      default: []

- id: peblar_restore_scheduled_charging_dev
  alias: Restore Peblar night schedule (DEV)
  description: Restore the recorded 02:00–06:00 DEV schedule and 28 A limit after the solar trial.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_button.peblar_restore_night_schedule
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.peblar_ev_charger_charge
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.peblar_solar_test_armed
          - input_boolean.peblar_solar_session_active
    - action: number.set_value
      target:
        entity_id: number.peblar_ev_charger_charge_limit
      data:
        value: 28
    - action: select.select_option
      target:
        entity_id: select.peblar_ev_charger_smart_charging
      data:
        option: scheduled
    - action: logbook.log
      data:
        name: Peblar solar test
        message: Restored scheduled mode and 28 A charging limit.

- id: growatt_tou_planner_write_test_dev
  alias: Growatt TOU planner write test (DEV)
  description: >-
    One-shot staging-only bridge from the read-only planner result to the
    growatt_modbus action surface. It is armed explicitly and writes only the
    selected fixed slot as one packed FC16 start/end pair.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.growatt_tou_write_test_armed
      to: "on"
      id: arm
  conditions:
    - condition: state
      entity_id: input_boolean.growatt_tou_write_test_armed
      state: "on"
    - condition: state
      entity_id: input_boolean.growatt_tou_write_test_done
      state: "off"
    - condition: state
      entity_id: sensor.ems_shadow_growatt_daytime_charge_status
      state: commit_window_reached
    - condition: template
      value_template: >-
        {% set plan = state_attr('sensor.ems_shadow_growatt_daytime_charge_status', 'selected') %}
        {{ plan is mapping and plan.valid and plan.slot == 1
           and plan.start is not none and plan.end is not none }}
  actions:
    - variables:
        selected: "{{ state_attr('sensor.ems_shadow_growatt_daytime_charge_status', 'selected') }}"
        # H3038 is a packed start/control word: time + Battery First (1) + enable.
        start_word: >-
          {{ (as_datetime(selected.start).hour * 256 +
              as_datetime(selected.start).minute + 40960) | int }}
        end_word: >-
          {{ (as_datetime(selected.end).hour * 256 +
              as_datetime(selected.end).minute) | int }}
    - action: growatt_modbus.write_registers
      data:
        device_id: 5514d973aad7df58676681e3a55ea464
        register: 3038
        values:
          - "{{ start_word }}"
          - "{{ end_word }}"
    - action: growatt_modbus.read_register
      continue_on_error: true
      data:
        device_id: 5514d973aad7df58676681e3a55ea464
        register: 3038
        register_type: holding
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.growatt_tou_write_test_done
    - action: logbook.log
      data:
        name: Growatt TOU planner
        message: >-
          Wrote planner slot 1 via growatt_modbus.write_registers:
          {{ state_attr('sensor.ems_shadow_growatt_daytime_charge_status', 'selected').start }}
          to
          {{ state_attr('sensor.ems_shadow_growatt_daytime_charge_status', 'selected').end }}.
